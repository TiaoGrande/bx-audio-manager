[project]
name = "bx-audio-manager"
version = "0.23.0"
description = "Organizador de acervo musical para Android/Termux"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "TiaoGrande"}]
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "mypy-baseline>=0.6",
    "ruff>=0.5",
]

[project.scripts]
bx = "bx:_cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "bx", "bx_core", "bx_dbx", "bx_nmx", "bx_crx",
    "bx_fix", "bx_get", "bx_testkit",
    "bx_kernel", "bx_io", "bx_media",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".bx_backups", "__pycache__", "temp_bx", "logs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"bx_testkit.py" = ["E402"]
"bx_core.py" = ["F403", "F405"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ".bx_backups|__pycache__|temp_bx"
